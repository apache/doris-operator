github:
  dependabot_alerts: true
  rulesets:
    - name: Default Branch Protection
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "branch-[0-9]*"
          - "[0-9]*.[0-9]*.[0-9]*"
          - "release/*"
          - "rel/*"
      restrict_deletion: true
      restrict_force_push: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        required_approving_review_count: 1

    - name: Release Tag Protection
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include:
            # Docker images and Helm charts are published on *.*.* tag pushes.
            - "refs/tags/*.*.*"
            - "refs/tags/v1.0"
            - "refs/tags/timeout-fix"
          exclude: []
      rules:
        - type: deletion
        - type: update
          parameters:
            update_allows_fetch_and_merge: false
